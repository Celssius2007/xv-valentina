<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070508">
<title>XV Valentina</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070508;color:#fff8f3;font-family:Georgia,"Times New Roman",serif}.app{width:100%;min-height:100vh}.screen{display:flex;justify-content:center;background:#070508}.cover{min-height:100svh;align-items:center}.art{position:relative;width:min(100%,863px);margin:0 auto}.art>img{display:block;width:100%;height:auto}.main{display:none}.main.open{display:block}.cover-hotspot{position:absolute;left:32.5%;top:82.5%;width:35%;height:9%;border:0;background:transparent;cursor:pointer;font-size:0;z-index:5}.cover-hotspot:focus-visible{outline:3px solid #d5ad72;border-radius:999px}.maps-hotspot{position:absolute;left:27%;top:23.2%;width:21%;height:4.7%;border:0;background:transparent;cursor:pointer;z-index:5}.count-value{position:absolute;top:5.2%;width:12%;height:4.8%;display:flex;align-items:center;justify-content:center;background:#481327;color:#d7ad73;font-size:clamp(18px,4.4vw,38px);line-height:1;z-index:4}.count-value.d{left:18.5%}.count-value.h{left:34.5%}.count-value.m{left:50.5%}.count-value.s{left:66.5%}.time-fix{position:absolute;left:68.8%;top:17.9%;width:22%;height:7%;display:flex;align-items:center;justify-content:center;background:#f0dfd6;color:#6f243f;font-size:clamp(13px,2.8vw,24px);font-weight:600;z-index:4}.rsvp-overlay{position:absolute;left:45.5%;top:73.3%;width:50%;min-height:19.2%;padding:1.4% 1.7%;background:rgba(8,7,10,.96);border:1px solid rgba(213,173,114,.35);border-radius:14px;z-index:6;box-shadow:0 10px 28px #0008}.guest-line{font-size:clamp(10px,1.65vw,15px);margin:0 0 2%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.guest-line b{color:#ef91a5}.choice-row{display:flex;gap:2%;margin-bottom:2.3%}.choice{flex:1;border:1px solid #d5ad72;border-radius:999px;padding:2.4% 2%;font:700 clamp(8px,1.3vw,12px) Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#8e2d4b,#681d39);cursor:pointer}.choice.secondary{background:#111014;color:#ef9cad}.choice.active{box-shadow:0 0 0 2px #d5ad72 inset}.comp-label{font:clamp(8px,1.2vw,11px) Arial,sans-serif;margin:1.8% 0 1%}.nums{display:flex;gap:2%;flex-wrap:nowrap;margin-bottom:1.8%}.num{width:12%;aspect-ratio:1;border:1px solid #d5ad72;border-radius:50%;background:#0d0c0f;color:white;padding:0;font:700 clamp(8px,1.25vw,12px) Arial,sans-serif;cursor:pointer}.num.on{background:#8e2d4b}.save{width:100%;border:0;border-radius:999px;padding:2.7% 2%;background:linear-gradient(180deg,#c99c63,#9f713c);color:#fff;font:700 clamp(8px,1.3vw,12px) Arial,sans-serif;cursor:pointer}.status{min-height:1.2em;margin:1.2% 0 0;color:#d5ad72;font:clamp(8px,1.15vw,11px) Arial,sans-serif;text-align:center}.music,.top{position:fixed;z-index:20;border:1px solid #d5ad72;color:white;background:rgba(83,25,48,.96);box-shadow:0 5px 20px #0007}.music{left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));border-radius:999px;padding:10px 14px;font:700 12px Arial,sans-serif}.top{right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:45px;height:45px;border-radius:50%;font-size:20px}.hidden{display:none!important}@media(max-width:520px){.rsvp-overlay{left:42.5%;width:55%;top:73%;padding:1.5%;border-radius:10px}.choice{font-size:7.5px}.guest-line{font-size:9px}.save{font-size:7.5px}.music{font-size:10px;padding:9px 11px}.time-fix{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <section id="cover" class="screen cover">
    <div class="art">
      <img src="./pantalla-1-portada-valentina.png" alt="Portada XV Valentina">
      <button id="open" class="cover-hotspot" aria-label="Abrir invitación">Abrir invitación</button>
    </div>
  </section>

  <main id="main" class="main">
    <section class="screen">
      <div class="art">
        <img src="./pantalla-2-invitacion-valentina.png" alt="Invitación XV Valentina">

        <div id="days" class="count-value d">0</div>
        <div id="hours" class="count-value h">0</div>
        <div id="minutes" class="count-value m">0</div>
        <div id="seconds" class="count-value s">0</div>

        <div class="time-fix">20:30 HRS</div>
        <a class="maps-hotspot" target="_blank" rel="noopener" aria-label="Cómo llegar" href="https://www.google.com/maps/search/?api=1&query=Salon+Monarca+Calle+Madro%C3%B1o+112+Colonia+Quince+de+Mayo+34103+Durango"></a>

        <div class="rsvp-overlay">
          <p class="guest-line">Invitado: <b id="guestName"></b></p>
          <div class="choice-row">
            <button id="yes" class="choice" type="button">SÍ, ASISTIRÉ</button>
            <button id="no" class="choice secondary" type="button">NO PODRÉ ASISTIR</button>
          </div>
          <div id="companions">
            <div class="comp-label">Acompañantes que asistirán</div>
            <div id="nums" class="nums"></div>
          </div>
          <button id="save" class="save" type="button">CONFIRMAR ASISTENCIA ♥</button>
          <div id="status" class="status"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<audio id="audio" preload="auto" loop src="./a-thousand-years.mp3"></audio>
<button id="music" class="music hidden" type="button">♫ A Thousand Years</button>
<button id="top" class="top hidden" type="button" aria-label="Volver arriba">↑</button>

<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbz614kSf4KLp0wleBcF9fVL_TMjCWpiPYgFZZdonGSLnIU7U5dJmpFR6RYkzTc9KtOe/exec';
const p=new URLSearchParams(location.search);
const name=(p.get('name')||'Invitado').trim();
const max=Math.max(0,Math.min(9,parseInt(p.get('max')||'0',10)||0));
const gid=(p.get('id')||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'invitado');
const $=id=>document.getElementById(id);
let attendance=null,extra=0,playing=false;

$('guestName').textContent=name;

for(let n=0;n<=max;n++){
  const b=document.createElement('button');
  b.type='button'; b.className='num'; b.textContent=n;
  if(n===0)b.classList.add('on');
  b.onclick=()=>{extra=n;[...$('nums').children].forEach(x=>x.classList.toggle('on',x===b));};
  $('nums').appendChild(b);
}
if(max===0)$('companions').classList.add('hidden');

$('open').onclick=async()=>{
  $('cover').classList.add('hidden');
  $('main').classList.add('open');
  $('music').classList.remove('hidden');
  $('top').classList.remove('hidden');
  window.scrollTo(0,0);
  try{await $('audio').play();playing=true;$('music').textContent='Ⅱ A Thousand Years';}
  catch(e){$('music').textContent='♫ A Thousand Years';}
};

$('music').onclick=async()=>{
  if(playing){$('audio').pause();playing=false;$('music').textContent='♫ A Thousand Years';}
  else{try{await $('audio').play();playing=true;$('music').textContent='Ⅱ A Thousand Years';}catch(e){}}
};
$('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

$('yes').onclick=()=>{attendance='Sí';$('yes').classList.add('active');$('no').classList.remove('active');if(max>0)$('companions').classList.remove('hidden');};
$('no').onclick=()=>{attendance='No';extra=0;$('no').classList.add('active');$('yes').classList.remove('active');$('companions').classList.add('hidden');};

$('save').onclick=async()=>{
  if(!attendance){$('status').textContent='Selecciona si asistirás o no.';return;}
  const data={id:gid,nombre:name,asistencia:attendance,acompanantes:attendance==='Sí'?extra:0};
  $('save').disabled=true;$('save').textContent='ENVIANDO...';
  try{
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
    $('status').textContent=attendance==='Sí'?'¡Gracias por confirmar!':'Gracias por avisarnos.';
    $('save').textContent='CONFIRMACIÓN ENVIADA ✓';
  }catch(e){$('status').textContent='No pudimos enviar la confirmación. Inténtalo nuevamente.';$('save').textContent='CONFIRMAR ASISTENCIA ♥';}
  finally{$('save').disabled=false;}
};

const target=new Date('2026-12-19T20:30:00-06:00').getTime();
function tick(){
  const x=Math.max(0,target-Date.now());
  $('days').textContent=Math.floor(x/86400000);
  $('hours').textContent=Math.floor((x%86400000)/3600000);
  $('minutes').textContent=Math.floor((x%3600000)/60000);
  $('seconds').textContent=Math.floor((x%60000)/1000);
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
